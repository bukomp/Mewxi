[package]
name = "muxi"
version = "0.1.0"
edition = "2021"
description = "MCP server + TUI for real-time Claude Code usage stats"

[[bin]]
name = "muxi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
notify = "6"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

[profile.release]
lto = "thin"
strip = true

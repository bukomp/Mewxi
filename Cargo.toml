[package]
name = "mewxi"
version = "1.7.1"
edition = "2021"
description = "MCP server + TUI for real-time coding-agent usage stats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bukomp/Mewxi"
readme = "README.md"
keywords = ["tui", "mcp", "claude", "usage", "stats"]
categories = ["command-line-utilities", "development-tools"]
# Keep the .crate small: build.rs embeds blocks/*.toml and src include_str!s
# the ASCII logos; everything else (png, dist, docs, scripts) is repo-only.
include = ["src/**", "blocks/**", "images/*.ascii", "build.rs", "README.md"]

[[bin]]
name = "mewxi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
notify = "6"
portable-pty = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
vt100 = "0.16"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
# Decode Windows console-tool (schtasks/reg) output, which comes back in
# the box's OEM codepage rather than UTF-8 — see `decode_console` in
# src/setup.rs. Kept windows-only so macOS/Linux builds don't pull them.
encoding_rs = "0.8"
codepage = "0.1"

[build-dependencies]
# Used by build.rs to enumerate blocks/*.toml for embedding.
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

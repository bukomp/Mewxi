[package]
name = "mewxi"
version = "1.5.0"
edition = "2021"
description = "MCP server + TUI for real-time coding-agent usage stats"

[[bin]]
name = "mewxi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
notify = "6"
portable-pty = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
vt100 = "0.16"
walkdir = "2"

[build-dependencies]
# Used by build.rs to enumerate blocks/*.toml for embedding.
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
